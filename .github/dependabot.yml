version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Abaikan loncatan major version nodemailer (v8 -> v10) yang tidak kompatibel dengan @types/nodemailer v8
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]
